<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>소리블록 보이스 스파링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.51.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#eef0f3; --surface:#fff; --surface2:#f6f7f9; --line:#d9dde4;
  --ink:#1b2130; --ink2:#566077; --ink3:#8a93a6;
  --accent:#3547c9; --accent-ink:#fff; --accent-soft:#e3e7fb;
  --stress:#b7791f; --stress-soft:#fbf0d9;
  --ok:#1f8a5b; --ok-soft:#dcf2e7; --warn:#b36b00; --warn-soft:#fbead0; --bad:#c2413b; --bad-soft:#f9dfdd;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#11141a; --surface:#1a1f28; --surface2:#222835; --line:#2e3543;
  --ink:#e9ecf2; --ink2:#a9b1c3; --ink3:#747d91;
  --accent:#8d9bff; --accent-ink:#11141a; --accent-soft:#262d4d;
  --stress:#f2c14e; --stress-soft:#3a3016;
  --ok:#5fd19c; --ok-soft:#173327; --warn:#f0b04a; --warn-soft:#3a2c14; --bad:#ff8a80; --bad-soft:#3b1f1e;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 120px;display:flex;flex-direction:column;gap:12px}
button,select,input{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-weight:700;font-size:17px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink3)}
.toplinks{display:flex;gap:12px;align-items:center}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0;text-decoration:none}
.meter{font-family:var(--mono);font-size:11.5px;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11.5px;letter-spacing:.06em;color:var(--ink3);font-weight:600}
input,select{width:100%;font-size:15px;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row select.stage{width:auto;flex:0 0 auto}
.keys{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--ink2);padding:5px 11px;border-radius:999px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;color:var(--ink2);padding:9px;border-radius:9px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.banner{border-radius:12px;padding:11px 13px;font-size:14px;font-weight:500}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner b{font-weight:700}
.log{display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:10px 13px;border-radius:14px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.msg.ai{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg .sub{font-size:12.5px;color:var(--ink3)}
.msg.me .sub{color:inherit;opacity:.8}
.q{font-size:19px;font-weight:600;line-height:1.45}
.fb{align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.verdict{display:inline-flex;font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:999px;width:max-content}
.v-pass{background:var(--ok-soft);color:var(--ok)} .v-close{background:var(--warn-soft);color:var(--warn)} .v-retry{background:var(--bad-soft);color:var(--bad)}
.sent{font-family:var(--mono);font-size:15px;line-height:1.6;word-break:break-word}
.sent .s{color:var(--stress);background:var(--stress-soft);border-radius:4px;padding:0 3px;font-weight:600}
.sent .l{color:var(--accent);font-weight:600}
.scores{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.scores b{color:var(--ink)}
ul.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.again{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:600;width:max-content}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;flex-direction:column;align-items:center;gap:6px}
.mic{width:100%;max-width:528px;border:0;border-radius:999px;padding:16px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);display:flex;justify-content:center;align-items:center;gap:10px}
.mic.on{background:var(--bad);color:#fff}
.mic:disabled{opacity:.55;cursor:default}
.mic .dot{width:11px;height:11px;border-radius:50%;background:currentColor}
.mic.on .dot{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.status{font-size:13px;color:var(--ink2);text-align:center;min-height:1.2em}
.note{font-size:12.5px;color:var(--ink3)}
.miss{color:var(--bad);background:var(--bad-soft);border-radius:4px;padding:0 3px;font-weight:600}
.extra{color:var(--ink3);text-decoration:line-through;padding:0 2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">소리블록 보이스 스파링<small>말로 문제 · 말로 대답 · 발음까지 채점</small></div>
    <div class="toplinks"><a class="linkbtn" href="./">발음 채점</a><button class="linkbtn" id="toggleSettings">설정</button></div>
  </header>
  <div class="meter" id="meter"></div>
  <div class="banner warn" id="banner" hidden></div>

  <section class="card" id="settings" hidden>
    <div class="lbl">GEMINI API 키 (영어 연습용 새 프로젝트 키)</div>
    <input id="gmKey" type="password" autocomplete="off" placeholder="AIza…">
    <div class="lbl">AZURE 음성 키 · 지역</div>
    <div class="row"><input id="azKey" type="password" autocomplete="off" placeholder="KEY 1"><input id="azRegion" style="max-width:120px" placeholder="eastus"></div>
    <div class="lbl">말하기 속도</div>
    <select id="rate"><option value="0.85">천천히</option><option value="1" selected>보통</option><option value="1.1">조금 빠르게</option></select>
    <button class="mic" id="saveSettings" style="padding:11px">저장</button>
    <div class="note">키는 이 폰 브라우저에만 저장돼요. 발음 채점 페이지와 Azure 키를 함께 써요.</div>
  </section>

  <section class="card">
    <div class="row">
      <select id="stage" class="stage" aria-label="단계"><option value="1">1단계</option><option value="2">2단계</option></select>
      <select id="partSel" aria-label="PART"></select>
    </div>
    <div class="keys" id="keys"></div>
    <div class="note" id="bankInfo" hidden></div>
    <div class="chips" role="group" aria-label="출제 범위">
      <button class="chip" data-scope="this">이 PART만</button>
      <button class="chip" data-scope="recent">최근 5개 섞기</button>
      <button class="chip" data-scope="all">배운 것 전체</button>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabBank" aria-selected="true">복습</button>
    <button role="tab" id="tabDrill" aria-selected="false">AI 드릴</button>
    <button role="tab" id="tabChat" aria-selected="false">대화</button>
  </nav>

  <div class="chips" id="topics" role="group" aria-label="대화 주제" hidden>
    <button class="chip" data-topic="일상">일상</button>
    <button class="chip" data-topic="업무 미팅">업무 미팅</button>
    <button class="chip" data-topic="여행">여행</button>
    <button class="chip" data-topic="자유 주제">자유</button>
  </div>

  <div class="log" id="log">
    <div class="msg ai" id="intro"><span>아래 <b>시작</b> 버튼을 누르면 문제를 소리로 읽어 드려요. 듣고 나서 마이크 버튼을 누르고 영어로 말하면 돼요.</span><span class="sub">말이 끝나고 1초쯤 조용하면 자동으로 채점돼요.</span></div>
  </div>
</div>

<div class="dock">
  <button class="mic" id="mic"><span class="dot"></span><span id="micLabel">시작</span></button>
  <div class="status" id="status" aria-live="polite"></div>
</div>

<script>
const CURR = [[1,4,"[어순&어법] 스피킹을 위한 Be 동사 개념 잡기","",["A: Did you have plans for the weekend? B: No, / /, why? (과거형, busy)","A: How was your day? B: It was so busy, I didn’t even have time to eat lunch.","A: I / / always happy. (현재형)"]],[1,5,"시작블록1. be 동사 포함 블록 part 1","I’m from, I’m on my way, I’m in the middle of, I’m about to",["A: / 다이어트 중이라 / so I can’t have that piece of cake. (diet )","A: I can’t talk right now, I’m / 회의 중이라 /. (meeting )","A: I’m / 가는 중이야 / to the store to pick up some groceries. (on my way )"]],[1,6,"시작블록2. be 동사 포함 블록 part 2","I’m good at, I’m ready for, I’m glad to, I’m here for",["A: Sarah /정말 잘해/ playing the piano.","A: John /잘해/ math; he always gets top grades in his class.","A: My best friend is /잘해/ listening; she always knows how to give good advice."]],[1,7,"시작블록3. be 동사 포함 블록 part 3","I’m afraid that, I’m sorry for, I’m sure of, I’m nervous about",["A: / 안타깝게도 / I can’t help you with that task.","A: / 어쩌죠 / we were out of stock.","A: / 어쩌죠 / I have to cancel our dinner plan for tonight."]],[1,8,"시작블록4. be 동사 포함 블록 part 4","Be able to, Be likely to, Be aware of, Be prone to",["A: She / 찾을 수 없었어 / her keys and was late for work. (과거형, find )","A: /기쁘다 // 도와줄 수 있어서 / you with your homework. (help )","A: I / 참석하지 못했어요 /the party last night because I had to work. (attend )"]],[1,9,"시작블록5. It’s 블록1","It’s just, It’s time to, It’s no wonder that, It’s like",["A: /그건 그냥/ a small scratch, don’t worry about it.","A: /그냥/ that I don’t like the way he talks to me.","A: /그냥/ that I don’t feel comfortable in this situation."]],[1,10,"시작블록6. It’s 블록2","Is it possible to, It is important to, It’s easy to, Is it true",["A: /가능해?/ learn a new language in just one year?","A: /가능해?/ live a happy life without money?","A: /가능해?/reschedule our meeting for next week? B: Yes, it’s possible. Let me check my calendar and suggest a new date and time."]],[1,11,"시작블록7. 원어민이 매일 쓰는 블록","There is/ There are",["A: /있어요? /a party tonight? B: Yes, /있어요/. It starts /저녁 8시에/","A: /있어요?/ any more chocolate? B: No, I’m sorry. /없어요/chocolate left.","A: I heard /불이 났다고/at the factory. B: Yes, /그랬어요/. But it’s under control now."]],[1,12,"코어블록1. 기본 동사 have","",["A: /있어?/any siblings? B: Yes, /저 있어요/ a younger sister and an older brother.","A: How are you feeling today? B: I /머리 아파/, unfortunately. (headache)","A: /있어?/ any pets? B: Yes, /있어요/a cat named Max."]],[1,13,"디테일블록1. 방법, 장소, 빈도, 시간, 목적, 조건, 동행, 기간","",["A: Where are you? B: I’m on my way to the supermarket to /식료품을 사러(groceries)","A: Can you talk right now? B: I’m in / the middle of a meeting /사무실에서/ (office)","A: Are you still at home? B: No, I’m about to leave if /비가 멈추면/."]],[1,14,"[어순&어법] 스피킹을 위한 Be + ing / Be + pp 개념 다시 잡기","",["A: I / 진행중입니다 / on a new project at the moment. (work)","A: The students / 공부하고 있습니다 / for their exams at the library. (study)","A: I/ 하고 있습니다 /part-time at the local restaurant to save up for college. (work)"]],[1,15,"시작블록8. be ~ving 블록 part 1","I’m getting, I’m just trying to, I’m thinking of, I’m talking about",["A: /점점 배고파져/ let’s grab some food. (hungry)","A: /점점 걱정돼/about the storm that’s coming. (worry)","A: /점점 늙어가고 있어/and starting to feel the effects of aging. (old)"]],[1,16,"시작블록9. be ~ving 블록 part 2","I’m dying to, I’m telling, I’m looking forward to, I was wondering if",["A: What’s your favorite part of the holiday season? B: /기대하고 있어/spending time with my family and friends.","A: /기대돼?/ the summer? B: Definitely! I love the warm weather and all the fun outdoor activities.","A: My sister /기대하고 있어/ her graduation ceremony next month."]],[1,17,"시작블록10. be pp 블록 part 1","I’m surprised by, I’m excited about, I’m disappointed with/in, I’m bored with, I’m frightened",["A: Did you hear about the new policy? B: /놀라워요 /how quickly they announced it/.","A: Did you see his drawing? B: 놀랐어요 /how good it is/.","A: Are you ready for the trip? B: 기대돼요 /visiting the new city/."]],[1,18,"시작블록11. be pp 블록 part 2","I’m satisfied with, I’m worried about, I’m used to, I’m supposed to",["A: Did you like the food at the restaurant last night? B: Yes, / 만족했습니다 / the quality and taste of the dishes.","A: How was the movie you watched last night? B: It was okay, but / 만족스럽지 않았어요 / the ending.","A: / 만족해요 / the results."]],[1,19,"코어블록2. 기본 동사 make","",["A: She’s /익숙해/ 침구 정리 하는 것이/ as soon as she wakes up.(bed)","A: 난 익숙해/ 커피 타는 것이/ every morning. (coffee)","A: /나 하기로 했었다/ 전화 걸기로/ to my friend last night, but I forgot. (call)"]],[1,20,"디테일블록2. 장소(Location)","",["A: /나~해야 돼 / 학교에 가다/ every weekday.","A: /나 할거야/ drive you/ 공항으로 / tomorrow","A: /나 여기~하러 왔어/ pick up my sister/ 기차역에서.."]],[1,21,"[어순&어법] 일반 동사 개념 잡기","",["I /일어나요/ /할거니?/ you get up?","She /좋아해/ /나를/ She /안 좋아해//나를/","She /바나나를 가져가서//먹어/ it."]],[1,22,"시작블록12. I wanna 블록","I wanna, I don’t wanna, Do you wanna, Don’t you wanna",["A: /원해요/ travel to Europe.","A: /원해/ /요가 하는 것을/ every morning.","A: What do you want to do today? B: /나 원해/ go to the beach and relax in the sun."]],[1,23,"시작블록13. I want you to 블록","I want you to, I don’t want you to, Do you want me to",["A: /나는 네가 ~했으면 좋겠어/clean your room before you go out with your friends.","A: /너가 안했으면 좋겠어./ stay up too late.","A: /내가~길 원하니?/ pick up some groceries on the way home?"]],[1,24,"시작블록14. I just wanted to 블록","I just wanted to, I told you to, I had no idea, I didn’t mean to",["A: /전혀 몰랐어/that he had such a serious medical condition.","A: When I found out that she was pregnant, /전혀 몰랐어/how to react.","A: /내가~하라고 말했지/finish your homework before playing video games."]],[1,25,"시작블록15. I like 블록","I like, I don’t like, I like it when, I like the way",["A: /나 좋아해/ 시간 보내는 것을/ with my family and friends. (spend time)","A: 나 좋아해/ 여행하는 것을/ to different countries and / 경험하는 것을/ different cultures. (travel, experience)","A: /마음에 들어요/ outfit today. It looks really nice on you. B: Thank you so much, I picked it out specifically for this occasion."]],[1,26,"시작블록16. I think 블록","I think, I don’t think, Do you think, Don’t you think..",["A: /어떻게 생각해?/ the new restaurant in town? B: /내 생각엔/ it’s really good. I tried it last week and the food was amazing.","A: /원해?/ try this new restaurant in town? B: /그닥/. I’ve heard mixed reviews about it","A: /나는 ~ 인거 같지 않아/ this dress suits me. I need to try on something else."]],[1,27,"시작블록17. I’ve got 블록","I’ve got, I don’t have, I haven’t got, Do you have, Have you got",["A: /있어요/a lot of work to do today.","A: /나 있어/ tickets to the concert next week.","A: /없어요/ any cash on me, do you take cards?"]],[1,28,"시작블록18. I have to 블록","I have to, need, must, have got to, got to, Do you have to, Have you got to, I don’t have to, I had to, I need to",["A: /너 해야돼/ finish your homework before you can go out with your friends.","A: /나 해야돼/ go to the dentist today for a check-up.","A: /~할 필요없어/come to the party if you don't want to."]],[1,29,"시작블록19. I know 블록","I know, Do you know, I don’t know",["A: /모르겠네 / what time the movie starts.","A: /어떻게 하는지 알아요?/ to speak English fluently? (how)","A: /~인지 모르겠네/ I can make it to the meeting tomorrow (if)"]],[1,30,"코어블록3. 기본 동사 get","",["A: /나 해야돼/ 장을 좀 보는 것을/ on my way home. (groceries)","A: /그녀는 할 수 있었는데/좋은 성적을 얻는 것을/ on her exam. (grade)","A: /나 할거야/ 커피 사는 것을/ before our meeting. (coffee)"]],[1,31,"디테일블록3. 빈도(Frequency)","",["A: /항상 공부 하니?/ at the library? B: Yes, /나는 보통 거기 가/to study because it’s quiet and I can focus.","A: /저를 도와주실 수 있는지 궁금해서요./ with my math homework. B: Of course, /나는 가끔 과외해줘/other students in math, so I’m happy to help you.","A: /~하기로 했는데/ submit my essay yesterday, but I forgot. B: /넌 해야해/ 항상/ 알람설정을/ for important deadlines, so you don’t forget."]],[1,32,"시작블록20. 지각동사","",["A: / 봤어요? / John leave the building? B: Yes, I saw him leave just now.","A: / 들었어요? / the baby cry? B: Yes, I heard her cry in the other room.","A: What were they doing? B: /하는 걸 봤어요 / playing basketball in the park."]],[1,33,"시작블록21. 감각동사","",["A: How does the new chair feel? B: / / really comfortable.","A: How does this s async function apiError(r){

    const secs = ri && ri.retryDelay ? Math.ceil(parseFloat(ri.retryDelay)) : 60;
    return { kind: perDay ? "day" : "minute", secs, msg: e.message };

}

function ssmlOf(parts){
  const rate = Math.round((store.get("tts_rate", 1) - 1) * 100);

  return `<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="ko-KR">` +
    parts.filter(p => p.text).map(p => `<voice name="${v[p.lang]}"><prosody rate="${rate}%">${esc(p.text)}</prosody></voice>`).join("") + `</speak>`;
}
const ttsCache = new Map();   // 미리 만들어 둔 음성 (다음 문제·정답 문장)
function synth(parts){
  const ssml = ssmlOf(parts);
  if (ttsCache.has(ssml)) return ttsCache.get(ssml);
  const p = new Promise(resolve => {
    const cfg = azCfg(); if (!cfg) return resolve(null);
    cfg.speechSynthesisOutputFormat = SpeechSDK.SpeechSynthesisOutputFormat.Audio24Khz48KBitRateMonoMp3;
    const sy = new SpeechSDK.SpeechSynthesizer(cfg, null);

      else { ttsCache.delete(ssml); resolve(null); }
    }, () => { sy.close(); ttsCache.delete(ssml); resolve(null); });

function toPcm16(f32, inRate){

    for (let k = s0; k < s1; k++) sum += f32[k];

function scoreAudio(chunks, refText){
  return new Promise(resolve => {
    const cfg = baseCfg(); if (!cfg || !chunks.length) return resolve(null);
    const fmt = SpeechSDK.AudioStreamFormat.getWaveFormatPCM(16000, 16, 1);
    const push = SpeechSDK.AudioInputStream.createPushStream(fmt);

    rec.recognizeOnceAsync(r => {

    const a = w.PronunciationAssessment || {};
    const fb = a.Feedback && a.Feedback.Prosody;
    if (fb && fb.Break && (fb.Break.ErrorTypes || []).some(t => t !== "None")) breaks.push(w.Word);
    const badPh = (w.Phonemes || []).filter(p => (p.PronunciationAssessment || {}).AccuracyScore < 60).map(p => {
      const nbp = (p.PronunciationAssessment || {}).NBestPhonemes; const heard = nbp && nbp[0] && nbp[0].Phoneme !== p.Phoneme ? `→${nbp[0].Phoneme}` : "";
      return `/${p.Phoneme}/${heard}`; });
    if ((a.AccuracyScore ?? 100) < 75 || badPh.length) low.push(`${w.Word}(${Math.round(a.AccuracyScore ?? 0)}${badPh.length ? " " + badPh.join(" ") : ""})`);
  });
  const sc = { pron: pa.PronScore, acc: pa.AccuracyScore, flu: pa.FluencyScore, pros: pa.ProsodyScore };
  const text = `종합 ${Math.round(sc.pron ?? 0)} · 정확도 ${Math.round(sc.acc ?? 0)} · 유창성 ${Math.round(sc.flu ?? 0)} · 운율·억양 ${sc.pros != null ? Math.round(sc.pros) : "-"}\n낮은 단어/음소: ${low.join(", ") || "없음"}\n끊긴 곳(다음 단어 앞에서 끊김): ${breaks.join(", ") || "없음"}`;
  return { text, scores: sc, low: low.slice(0, 4).join(", ") };
}

const BANK_ALL = typeof BANK !== "undefined" ? BANK.map((b, i) => ({ id: `${b[0]}-${b[1]}-${b[7] ?? i}`, s:b[0], p:b[1], ty:b[2], ko:b[3], en:b[4], alt:b[5] || [], key:b[6] })) : [];
const CONTR = { "i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","there's":"there is","what's":"what is","where's":"where is","who's":"who is","how's":"how is","here's":"here is","let's":"let us",
  "can't":"cannot","won't":"will not","don't":"do not","doesn't":"does not","didn't":"did not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","haven't":"have not","hasn't":"has not","hadn't":"had not","couldn't":"could not","shouldn't":"should not","wouldn't":"would not","mustn't":"must not",
  "gonna":"going to","wanna":"want to","gotta":"got to","kinda":"kind of","gimme":"give me","ok":"okay","can not":"cannot" };
function normWords(t){
  let x = " " + String(t || "").toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9' ]+/g, " ") + " ";
  for (const [k, v] of Object.entries(CONTR)) x = x.split(" " + k + " ").join(" " + v + " ");
  x = x.replace(/'ll /g, " will ").replace(/'ve /g, " have ").replace(/'d /g, " would ").replace(/'re /g, " are ").replace(/'s /g, " ").replace(/'/g, "");
  return x.split(/\s+/).filter(Boolean);
}
function align(a, b){   // 단어 단위 편집거리 + 정렬
  const n = a.length, m = b.length, d = Array.from({ length: n + 1 }, (_, i) => { const r = new Array(m + 1).fill(0); r[0] = i; return r; });
  for (let j = 0; j <= m; j++) d[0][j] = j;
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  const ops = []; let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && d[i][j] === d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)) { ops.unshift(a[i-1] === b[j-1] ? ["=", a[i-1]] : ["~", a[i-1], b[j-1]]); i--; j--; }
    else if (i > 0 && d[i][j] === d[i-1][j] + 1) { ops.unshift(["-", a[i-1]]); i--; }
    else { ops.unshift(["+", b[j-1]]); j--; }
  }
  return { dist: d[n][m], ops };
}
function hasSeq(words, seq){ if (!seq.length) return true; for (let i = 0; i + seq.length <= words.length; i++) if (seq.every((w, k) => words[i + k] === w)) return true; return false; }
function gradeLocal(it, heard){
  const hw = normWords(heard), kw = normWords(it.key);
  let best = null;
  [it.en, ...it.alt].forEach(t => { const tw = normWords(t); const al = align(tw, hw); const sim = 1 - al.dist / Math.max(tw.length, hw.length, 1); if (!best || sim > best.sim) best = { target: t, sim, ops: al.ops }; });
  const keyOk = hasSeq(hw, kw);
  const verdict = keyOk && best.sim >= 0.85 ? "pass" : keyOk && best.sim >= 0.6 ? "close" : "retry";
  return { ...best, keyOk, verdict };
}
function diffHtml(ops){
  return ops.map(o => o[0] === "=" ? esc(o[1]) : o[0] === "-" ? `<span class="miss">${esc(o[1])}</span>` : o[0] === "~" ? `<span class="miss">${esc(o[1])}</span><span class="extra">${esc(o[2])}</span>` : `<span class="extra">${esc(o[1])}</span>`).join(" ");
}
/* 간격 반복: 상자 0~4, 틀리면 0으로 */
const BOX_MIN = [0, 10, 60 * 24, 60 * 24 * 3, 60 * 24 * 7];
function srs(){ return store.get("vs_srs", {}); }
function srsUpdate(id, ok){
  const all = srs(); const r = all[id] || { b: 0, n: 0, ok: 0 };
  r.n++; if (ok) { r.ok++; r.b = Math.min(4, r.b + 1); } else r.b = 0;
  r.due = Date.now() + BOX_MIN[r.b] * 60000 + (ok ? 0 : 3 * 60000); r.last = Date.now();
  all[id] = r; store.set("vs_srs", all);
}
let bankRecent = [];
function bankPick(){
  const parts = new Set(scopeParts().map(c => c[0] + "-" + c[1]));
  const pool = BANK_ALL.filter(it => parts.has(it.s + "-" + it.p) && !bankRecent.includes(it.id));
  if (!pool.length) return BANK_ALL.find(it => parts.has(it.s + "-" + it.p)) || null;
  const st = srs(), now = Date.now();
  const due = pool.filter(it => st[it.id] && st[it.id].due <= now).sort((a, b) => st[a.id].b - st[b.id].b || st[a.id].due - st[b.id].due);
  if (due.length) return due[0];
  const fresh = pool.filter(it => !st[it.id]);
  if (fresh.length) return fresh[Math.floor(Math.random() * Math.min(fresh.length, 8))];
  return pool.sort((a, b) => st[a.id].b - st[b.id].b || st[a.id].last - st[b.id].last)[0];
}
function todayStats(){ const t = store.get("vs_today", {}); const d = new Date().toLocaleDateString("en-CA"); return t.d === d ? t : { d, n: 0, pass: 0 }; }
function bumpToday(pass){ const t = todayStats(); t.n++; if (pass) t.pass++; store.set("vs_today", t); renderBankInfo(); }
function renderBankInfo(){
  const parts = new Set(scopeParts().map(c => c[0] + "-" + c[1])); const st = srs();
  const pool = BANK_ALL.filter(it => parts.has(it.s + "-" + it.p));
  const seen = pool.filter(it => st[it.id]).length, strong = pool.filter(it => st[it.id] && st[it.id].b >= 2).length;
  const t = todayStats();
  $("#bankInfo").textContent = `범위 ${pool.length}문제 · 푼 문제 ${seen} · 익숙해짐 ${strong} | 오늘 ${t.n}문제 (통과 ${t.pass})`;
}
const SKIP_RE = /^(skip|next|pass|i don'?t know|no idea)\.?$/i;
let bankOn = false, bankLoop = 0, bankItem = null;
function bankSetMic(){ const m = $("#mic"); m.disabled = false; m.classList.toggle("on", bankOn); $("#micLabel").textContent = bankOn ? "멈추기" : (bankItem ? "계속하기" : "복습 시작"); }
function bankStop(msg){ bankOn = false; bankLoop++; cancelListen(); stopSpeaking(); bankSetMic(); if (msg != null) setStatus(msg); }
async function bankRun(){
  const my = ++bankLoop; bankOn = true; bankSetMic();
  const alive = () => bankOn && my === bankLoop;
  while (alive()) {
    const it = bankItem || bankPick();
    if (!it) { bankStop("이 범위에는 아직 문제은행 문제가 없어요. 범위를 바꾸거나 'AI 드릴'을 써 주세요."); return; }
    bankItem = it; bankRecent.push(it.id); bankRecent = bankRecent.slice(-6);
    const c = find(it.s, it.p);
    const card = addMsg("ai", `<span class="sub">PART ${String(it.p).padStart(2,"0")} · ${esc(c[2])} · <b>${esc(it.ty)}</b></span><span class="q">${esc(it.ko)}</span><span class="sub">목표 블록 <b>${esc(it.key)}</b></span>`);
    synth([{ lang:"en", text: it.en }]);          // 정답 음성 미리 준비
    setStatus("");
    await speak([{ lang:"ko", text: it.ko }]); if (!alive()) return;
    let tries = 0, heard = null;
    while (alive() && !heard) {
      setStatus("말씀하세요 (모르면 'skip')");
      try { heard = await listen(); }
      catch(e) {
        if (!alive()) return;
        if (e.kind === "nomatch" && e.why === "silence") { bankStop("10초 동안 대답이 없어서 멈췄어요. 버튼을 누르면 이 문제부터 다시 해요."); return; }
        if (e.kind === "nomatch" && ++tries < 3) { setStatus("잘 못 알아들었어요. 한 번 더 말해 주세요."); await sleep(700); continue; }
        if (e.kind === "cancel") return;

      }
    }
    if (!alive()) return;
    const skipped = SKIP_RE.test(heard.text.trim());
    addMsg("me", `<span>${esc(heard.text)}</span>`);
    const g = skipped ? { verdict:"retry", target: it.en, ops: normWords(it.en).map(w => ["-", w]), keyOk:false, sim:0 } : gradeLocal(it, heard.text);
    const fb = document.createElement("div"); fb.className = "fb";
    const [vc, vl] = VL[g.verdict];
    fb.innerHTML = `<span class="verdict ${vc}">${skipped ? "정답 확인" : vl}</span>
      <div class="sent">${esc(g.target)}</div>
      ${!skipped && g.verdict !== "pass" ? `<div class="note">내 대답과 비교: ${diffHtml(g.ops)}</div>` : ""}
      ${!skipped && !g.keyOk ? `<div class="note">목표 블록 <b>${esc(it.key)}</b> 이(가) 안 들렸어요.</div>` : ""}
      <div class="scores" data-sc>발음 채점 중…</div>
      <div class="row"><button class="again" data-say="${esc(it.en)}">▶ 정답 다시 듣기</button><a class="again" href="./?t=${encodeURIComponent(it.en)}" target="_blank" rel="noopener">발음만 따로 채점</a></div>`;
    log.append(fb); fb.scrollIntoView({ block:"end", behavior:"smooth" });
    const scEl = fb.querySelector("[data-sc]");
    if (skipped) scEl.remove();
    else scoreAudio(heard.chunks, heard.text).then(j => { const ps = pronSummary(j); scEl.innerHTML = ps.scores ? scoreLine("내 대답", ps.scores) : "발음 점수 없음"; }).catch(() => { scEl.textContent = "발음 점수 없음"; });
    srsUpdate(it.id, g.verdict === "pass"); bumpToday(g.verdict === "pass");
    record(heard.text, { verdict: g.verdict, corrected: it.en, weak_tag: g.verdict === "pass" ? "" : it.key }, null);
    // AI 코치: 뜻은 비슷한데 표현이 많이 다를 때만
    if (!skipped && g.keyOk && g.verdict === "retry" && store.get("gm_key", "")) {
      setStatus("표현이 달라서 AI 코치에게 물어보는 중…");
      try {
        const r = await gemini(`너는 소리블록 코치야. 한국어 문제를 영어로 말하는 연습이야.\n한국어: ${it.ko}\n목표 블록: ${it.key}\n모범답: ${it.en}\n학습자 답(받아쓰기): ${heard.text}\n학습자 답이 뜻이 맞고 자연스러우면 ok=true. 짧게.\nJSON: {"ok":true,"say":"한국어 1문장 코멘트"}`);
        if (!alive()) return;
        if (r.ok) { fb.querySelector(".verdict").className = "verdict v-close"; fb.querySelector(".verdict").textContent = "다른 표현이지만 OK"; }
        if (r.say) { const n = document.createElement("div"); n.className = "note"; n.textContent = "AI 코치: " + r.say; fb.insertBefore(n, fb.querySelector(".row")); }
      } catch(e) {}
    }
    if (!alive()) return;
    setStatus("");
    const next = bankPick(); if (next) synth([{ lang:"ko", text: next.ko }]);   // 다음 문제 음성 미리 준비
    if (g.verdict === "pass") {
      await speak([{ lang:"ko", text:"좋아요." }, { lang:"en", text: it.en }]);
    } else {
      // 틀리거나 아쉬우면: 정답 듣고 한 번 따라 말하기 (정답 문장 기준 발음 채점)
      await speak([{ lang:"ko", text:"정답은" }, { lang:"en", text: it.en }]); if (!alive()) return;
      await speak([{ lang:"ko", text:"따라 해 보세요." }]); if (!alive()) return;
      setStatus("정답 문장을 따라 말해 보세요");
      try {
        const sh = await listen(); if (!alive()) return;
        setStatus("따라 말하기 채점 중…");
        const j = await scoreAudio(sh.chunks, it.en).catch(() => null); const ps = pronSummary(j);
        const n = document.createElement("div"); n.className = "scores";
        n.innerHTML = ps.scores ? scoreLine("따라 말하기", ps.scores) + (ps.low ? ` <span class="note">· 낮은 단어: ${esc(ps.low)}</span>` : "") : "따라 말하기 점수 없음";
        fb.insertBefore(n, fb.querySelector(".row")); fb.scrollIntoView({ block:"end", behavior:"smooth" });
      } catch(e) { if (!alive()) return; if (e.kind === "nomatch" && e.why === "silence") { /* 따라 말하기는 건너뛰어도 됨 */ } }
    }
    if (!alive()) return;
    bankItem = null;
    await sleep(350);
  }
}
function scoreLine(label, sc){ return `<span>${esc(label)}</span><span>발음 <b>${Math.round(sc.pron ?? 0)}</b></span><span>정확도 <b>${Math.round(sc.acc ?? 0)}</b></span><span>유창성 <b>${Math.round(sc.flu ?? 0)}</b></span><span>억양 <b>${sc.pros != null ? Math.round(sc.pros) : "-"}</b></span>`; }

/* ---------- 마이크 버튼 ---------- */
let started = false;
$("#mic").onclick = async () => {
  if (S.mode === "bank") {
    if (bankOn) { bankStop("멈췄어요. 버튼을 누르면 이어서 해요."); return; }
    if (!store.get("az_key", "")) { $("#settings").hidden = false; setStatus("설정에서 Azure 키를 먼저 저장해 주세요."); return; }
    hideBanner(); bankRun(); return;
  }
  if (recognizer || cap) { cancelListen(); setMic("idle"); setStatus(""); return; }
  if (busy) return;
  busy = true; hideBanner(); stopSpeaking();
  try {
    if (!started) {
      if (!store.get("gm_key", "") || !store.get("az_key", "")) { $("#settings").hidden = false; setStatus("설정에서 Gemini 키와 Azure 키를 먼저 저장해 주세요."); busy = false; return; }
      started = true;
      await (S.mode === "drill" ? drillStart() : chatStart());
    } else {
      setMic("rec"); setStatus("말씀하세요.");
      const heard = await listen();
      setStatus("발음 채점 중…"); heard.json = await scoreAudio(heard.chunks, heard.text).catch(() => null);
      await (S.mode === "drill" ? drillAnswer(heard) : chatAnswer(heard));
    }
  } catch(e) {
    if (e && e.kind === "nomatch") {
      if (e.why === "silence") setStatus("10초 동안 말소리가 들리지 않았어요. 버튼을 누른 뒤 바로 말해 주세요. (마이크를 손으로 가리지 않았는지도 확인)");
      else if (e.why === "babble") setStatus("주변 소음만 들렸어요. 조용한 곳에서 폰 가까이 대고 다시 말해 주세요.");
      else setStatus("말소리는 들렸는데 알아듣지 못했어요. 조금 천천히, 또박또박 다시 말해 주세요.");
    }
    else if (e && e.kind === "cancel") setStatus("");
    else if (e && e.kind === "mic") setStatus("마이크를 쓸 수 없어요. 브라우저의 마이크 권한을 허용해 주세요.");
    else if (e && (e.kind === "az" || e.kind === "azerr")) setStatus("Azure에 연결하지 못했어요. 설정의 Azure 키와 지역을 확인해 주세요.");
    else handleErr(e);
    if (!started || !(item || turns.length)) started = false;
    setMic(started ? "idle" : "start");
  }
  busy = false;
};

/* ---------- 선택 변경 ---------- */
const INTRO_BANK = `<span><b>복습 시작</b>을 누르면 버튼 없이 계속 이어져요: 한국어 문제 듣기 → 바로 영어로 말하기 → 즉시 채점 → 틀리면 정답 따라 말하기 → 다음 문제.</span><span class="sub">모르면 "skip"이라고 말하세요. 10초 동안 조용하면 자동으로 멈춰요.</span>`;
const INTRO_AI = `<span>아래 <b>시작</b> 버튼을 누르면 AI가 새 문제를 만들어 소리로 읽어 드려요. 듣고 나서 마이크 버튼을 누르고 영어로 말하면 돼요.</span><span class="sub">말이 끝나고 1초쯤 조용하면 자동으로 채점돼요.</span>`;
function restart(){ if (bankOn) bankStop(); bankItem = null; bankRecent = []; if (S.mode === "bank") { renderBankInfo(); bankSetMic(); setStatus(""); } started = false; item = null; turns = []; if (S.mode !== "bank") { setMic("start"); setStatus("설정이 바뀌었어요. 시작을 누르면 새로 시작해요."); } }
$("#stage").onchange = e => { S.stage = +e.target.value; S.part = partsOf(S.stage)[0][1]; renderParts(); saveS(); restart(); };
$("#partSel").onchange = e => { S.part = +e.target.value; renderParts(); saveS(); restart(); };
document.querySelectorAll("[data-scope]").forEach(b => b.onclick = () => { S.scope = b.dataset.scope; renderParts(); saveS(); restart(); });
document.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { S.topic = b.dataset.topic; renderParts(); saveS(); if (S.mode === "chat") restart(); });
function setMode(m){
  S.mode = m; saveS();
  $("#tabBank").setAttribute("aria-selected", String(m === "bank")); $("#tabDrill").setAttribute("aria-selected", String(m === "drill")); $("#tabChat").setAttribute("aria-selected", String(m === "chat"));
  $("#topics").hidden = m !== "chat"; $("#bankInfo").hidden = m !== "bank";
  $("#intro").innerHTML = m === "bank" ? INTRO_BANK : INTRO_AI;
  setStatus(""); restart(); if (m !== "bank") setStatus("");
}
$("#tabBank").onclick = () => setMode("bank");
$("#tabDrill").onclick = () => setMode("drill");
$("#tabChat").onclick = () => setMode("chat");

loadSettings(); renderParts(); setMode(S.mode); renderMeter();
if (!store.get("az_key", "")) { $("#settings").hidden = false; setStatus("처음 한 번만 Azure 키를 저장해 주세요. (복습은 Azure만 있으면 되고, AI 드릴·대화는 Gemini 키도 필요해요)"); }
</script>
</body>
