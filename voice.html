<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>소리블록 보이스 스파링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.51.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#eef0f3; --surface:#fff; --surface2:#f6f7f9; --line:#d9dde4;
  --ink:#1b2130; --ink2:#566077; --ink3:#8a93a6;
  --accent:#3547c9; --accent-ink:#fff; --accent-soft:#e3e7fb;
  --stress:#b7791f; --stress-soft:#fbf0d9;
  --ok:#1f8a5b; --ok-soft:#dcf2e7; --warn:#b36b00; --warn-soft:#fbead0; --bad:#c2413b; --bad-soft:#f9dfdd;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#11141a; --surface:#1a1f28; --surface2:#222835; --line:#2e3543;
  --ink:#e9ecf2; --ink2:#a9b1c3; --ink3:#747d91;
  --accent:#8d9bff; --accent-ink:#11141a; --accent-soft:#262d4d;
  --stress:#f2c14e; --stress-soft:#3a3016;
  --ok:#5fd19c; --ok-soft:#173327; --warn:#f0b04a; --warn-soft:#3a2c14; --bad:#ff8a80; --bad-soft:#3b1f1e;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 120px;display:flex;flex-direction:column;gap:12px}
button,select,input{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-weight:700;font-size:17px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink3)}
.toplinks{display:flex;gap:12px;align-items:center}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0;text-decoration:none}
.meter{font-family:var(--mono);font-size:11.5px;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11.5px;letter-spacing:.06em;color:var(--ink3);font-weight:600}
input,select{width:100%;font-size:15px;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row select.stage{width:auto;flex:0 0 auto}
.keys{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--ink2);padding:5px 11px;border-radius:999px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;color:var(--ink2);padding:9px;border-radius:9px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.banner{border-radius:12px;padding:11px 13px;font-size:14px;font-weight:500}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner b{font-weight:700}
.log{display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:10px 13px;border-radius:14px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.msg.ai{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg .sub{font-size:12.5px;color:var(--ink3)}
.msg.me .sub{color:inherit;opacity:.8}
.q{font-size:19px;font-weight:600;line-height:1.45}
.fb{align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.verdict{display:inline-flex;font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:999px;width:max-content}
.v-pass{background:var(--ok-soft);color:var(--ok)} .v-close{background:var(--warn-soft);color:var(--warn)} .v-retry{background:var(--bad-soft);color:var(--bad)}
.sent{font-family:var(--mono);font-size:15px;line-height:1.6;word-break:break-word}
.sent .s{color:var(--stress);background:var(--stress-soft);border-radius:4px;padding:0 3px;font-weight:600}
.sent .l{color:var(--accent);font-weight:600}
.scores{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.scores b{color:var(--ink)}
ul.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.again{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:600;width:max-content}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;flex-direction:column;align-items:center;gap:6px}
.mic{width:100%;max-width:528px;border:0;border-radius:999px;padding:16px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);display:flex;justify-content:center;align-items:center;gap:10px}
.mic.on{background:var(--bad);color:#fff}
.mic:disabled{opacity:.55;cursor:default}
.mic .dot{width:11px;height:11px;border-radius:50%;background:currentColor}
.mic.on .dot{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.status{font-size:13px;color:var(--ink2);text-align:center;min-height:1.2em}
.note{font-size:12.5px;color:var(--ink3)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">소리블록 보이스 스파링<small>말로 문제 · 말로 대답 · 발음까지 채점</small></div>
    <div class="toplinks"><a class="linkbtn" href="./">발음 채점</a><button class="linkbtn" id="toggleSettings">설정</button></div>
  </header>
  <div class="meter" id="meter"></div>
  <div class="banner warn" id="banner" hidden></div>

  <section class="card" id="settings" hidden>
    <div class="lbl">GEMINI API 키 (영어 연습용 새 프로젝트 키)</div>
    <input id="gmKey" type="password" autocomplete="off" placeholder="AIza…">
    <div class="lbl">AZURE 음성 키 · 지역</div>
    <div class="row"><input id="azKey" type="password" autocomplete="off" placeholder="KEY 1"><input id="azRegion" style="max-width:120px" placeholder="eastus"></div>
    <div class="lbl">말하기 속도</div>
    <select id="rate"><option value="0.85">천천히</option><option value="1" selected>보통</option><option value="1.1">조금 빠르게</option></select>
    <button class="mic" id="saveSettings" style="padding:11px">저장</button>
    <div class="note">키는 이 폰 브라우저에만 저장돼요. 발음 채점 페이지와 Azure 키를 함께 써요.</div>
  </section>

  <section class="card">
    <div class="row">
      <select id="stage" class="stage" aria-label="단계"><option value="1">1단계</option><option value="2">2단계</option></select>
      <select id="partSel" aria-label="PART"></select>
    </div>
    <div class="keys" id="keys"></div>
    <div class="chips" role="group" aria-label="출제 범위">
      <button class="chip" data-scope="this">이 PART만</button>
      <button class="chip" data-scope="recent">최근 5개 섞기</button>
      <button class="chip" data-scope="all">배운 것 전체</button>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabDrill" aria-selected="true">한→영 드릴</button>
    <button role="tab" id="tabChat" aria-selected="false">대화</button>
  </nav>

  <div class="chips" id="topics" role="group" aria-label="대화 주제" hidden>
    <button class="chip" data-topic="일상">일상</button>
    <button class="chip" data-topic="업무 미팅">업무 미팅</button>
    <button class="chip" data-topic="여행">여행</button>
    <button class="chip" data-topic="자유 주제">자유</button>
  </div>

  <div class="log" id="log">
    <div class="msg ai"><span>아래 <b>시작</b> 버튼을 누르면 문제를 소리로 읽어 드려요. 듣고 나서 마이크 버튼을 누르고 영어로 말하면 돼요.</span><span class="sub">말이 끝나고 1초쯤 조용하면 자동으로 채점돼요.</span></div>
  </div>
</div>

<div class="dock">
  <button class="mic" id="mic"><span class="dot"></span><span id="micLabel">시작</span></button>
  <div class="status" id="status" aria-live="polite"></div>
</div>

<script>
const CURR = [[1,4,"[어순&어법] 스피킹을 위한 Be 동사 개념 잡기","",["A: Did you have plans for the weekend? B: No, / /, why? (과거형, busy)","A: How was your day? B: It was so busy, I didn’t even have time to eat lunch.","A: I / / always happy. (현재형)"]],[1,5,"시작블록1. be 동사 포함 블록 part 1","I’m from, I’m on my way, I’m in the middle of, I’m about to",["A: / 다이어트 중이라 / so I can’t have that piece of cake. (diet )","A: I can’t talk right now, I’m / 회의 중이라 /. (meeting )","A: I’m / 가는 중이야 / to the store to pick up some groceries. (on my way )"]],[1,6,"시작블록2. be 동사 포함 블록 part 2","I’m good at, I’m ready for, I’m glad to, I’m here for",["A: Sarah /정말 잘해/ playing the piano.","A: John /잘해/ math; he always gets top grades in his class.","A: My best friend is /잘해/ listening; she always knows how to give good advice."]],[1,7,"시작블록3. be 동사 포함 블록 part 3","I’m afraid that, I’m sorry for, I’m sure of, I’m nervous about",["A: / 안타깝게도 / I can’t help you with that task.","A: / 어쩌죠 / we were out of stock.","A: / 어쩌죠 / I have to cancel our dinner plan for tonight."]],[1,8,"시작블록4. be 동사 포함 블록 part 4","Be able to, Be likely to, Be aware of, Be prone to",["A: She / 찾을 수 없었어 / her keys and was late for work. (과거형, find )","A: /기쁘다 // 도와줄 수 있어서 / you with your homework. (help )","A: I / 참석하지 못했어요 /the party last night because I had to work. (attend )"]],[1,9,"시작블록5. It’s 블록1","It’s just, It’s time to, It’s no wonder that, It’s like",["A: /그건 그냥/ a small scratch, don’t worry about it.","A: /그냥/ that I don’t like the way he talks to me.","A: /그냥/ that I don’t feel comfortable in this situation."]],[1,10,"시작블록6. It’s 블록2","Is it possible to, It is important to, It’s easy to, Is it true",["A: /가능해?/ learn a new language in just one year?","A: /가능해?/ live a happy life without money?","A: /가능해?/reschedule our meeting for next week? B: Yes, it’s possible. Let me check my calendar and suggest a new date and time."]],[1,11,"시작블록7. 원어민이 매일 쓰는 블록","There is/ There are",["A: /있어요? /a party tonight? B: Yes, /있어요/. It starts /저녁 8시에/","A: /있어요?/ any more chocolate? B: No, I’m sorry. /없어요/chocolate left.","A: I heard /불이 났다고/at the factory. B: Yes, /그랬어요/. But it’s under control now."]],[1,12,"코어블록1. 기본 동사 have","",["A: /있어?/any siblings? B: Yes, /저 있어요/ a younger sister and an older brother.","A: How are you feeling today? B: I /머리 아파/, unfortunately. (headache)","A: /있어?/ any pets? B: Yes, /있어요/a cat named Max."]],[1,13,"디테일블록1. 방법, 장소, 빈도, 시간, 목적, 조건, 동행, 기간","",["A: Where are you? B: I’m on my way to the supermarket to /식료품을 사러(groceries)","A: Can you talk right now? B: I’m in / the middle of a meeting /사무실에서/ (office)","A: Are you still at home? B: No, I’m about to leave if /비가 멈추면/."]],[1,14,"[어순&어법] 스피킹을 위한 Be + ing / Be + pp 개념 다시 잡기","",["A: I / 진행중입니다 / on a new project at the moment. (work)","A: The students / 공부하고 있습니다 / for their exams at the library. (study)","A: I/ 하고 있습니다 /part-time at the local restaurant to save up for college. (work)"]],[1,15,"시작블록8. be ~ving 블록 part 1","I’m getting, I’m just trying to, I’m thinking of, I’m talking about",["A: /점점 배고파져/ let’s grab some food. (hungry)","A: /점점 걱정돼/about the storm that’s coming. (worry)","A: /점점 늙어가고 있어/and starting to feel the effects of aging. (old)"]],[1,16,"시작블록9. be ~ving 블록 part 2","I’m dying to, I’m telling, I’m looking forward to, I was wondering if",["A: What’s your favorite part of the holiday season? B: /기대하고 있어/spending time with my family and friends.","A: /기대돼?/ the summer? B: Definitely! I love the warm weather and all the fun outdoor activities.","A: My sister /기대하고 있어/ her graduation ceremony next month."]],[1,17,"시작블록10. be pp 블록 part 1","I’m surprised by, I’m excited about, I’m disappointed with/in, I’m bored with, I’m frightened",["A: Did you hear about the new policy? B: /놀라워요 /how quickly they announced it/.","A: Did you see his drawing? B: 놀랐어요 /how good it is/.","A: Are you ready for the trip? B: 기대돼요 /visiting the new city/."]],[1,18,"시작블록11. be pp 블록 part 2","I’m satisfied with, I’m worried about, I’m used to, I’m supposed to",["A: Did you like the food at the restaurant last night? B: Yes, / 만족했습니다 / the quality and taste of the dishes.","A: How was the movie you watched last night? B: It was okay, but / 만족스럽지 않았어요 / the ending.","A: / 만족해요 / the results."]],[1,19,"코어블록2. 기본 동사 make","",["A: She’s /익숙해/ 침구 정리 하는 것이/ as soon as she wakes up.(bed)","A: 난 익숙해/ 커피 타는 것이/ every morning. (coffee)","A: /나 하기로 했었다/ 전화 걸기로/ to my friend last night, but I forgot. (call)"]],[1,20,"디테일블록2. 장소(Location)","",["A: /나~해야 돼 / 학교에 가다/ every weekday.","A: /나 할거야/ drive you/ 공항으로 / tomorrow","A: /나 여기~하러 왔어/ pick up my sister/ 기차역에서.."]],[1,21,"[어순&어법] 일반 동사 개념 잡기","",["I /일어나요/ /할거니?/ you get up?","She /좋아해/ /나를/ She /안 좋아해//나를/","She /바나나를 가져가서//먹어/ it."]],[1,22,"시작블록12. I wanna 블록","I wanna, I don’t wanna, Do you wanna, Don’t you wanna",["A: /원해요/ travel to Europe.","A: /원해/ /요가 하는 것을/ every morning.","A: What do you want to do today? B: /나 원해/ go to the beach and relax in the sun."]],[1,23,"시작블록13. I want you to 블록","I want you to, I don’t want you to, Do you want me to",["A: /나는 네가 ~했으면 좋겠어/clean your room before you go out with your friends.","A: /너가 안했으면 좋겠어./ stay up too late.","A: /내가~길 원하니?/ pick up some groceries on the way home?"]],[1,24,"시작블록14. I just wanted to 블록","I just wanted to, I told you to, I had no idea, I didn’t mean to",["A: /전혀 몰랐어/that he had such a serious medical condition.","A: When I found out that she was pregnant, /전혀 몰랐어/how to react.","A: /내가~하라고 말했지/finish your homework before playing video games."]],[1,25,"시작블록15. I like 블록","I like, I don’t like, I like it when, I like the way",["A: /나 좋아해/ 시간 보내는 것을/ with my family and friends. (spend time)","A: 나 좋아해/ 여행하는 것을/ to different countries and / 경험하는 것을/ different cultures. (travel, experience)","A: /마음에 들어요/ outfit today. It looks really nice on you. B: Thank you so much, I picked it out specifically for this occasion."]],[1,26,"시작블록16. I think 블록","I think, I don’t think, Do you think, Don’t you think..",["A: /어떻게 생각해?/ the new restaurant in town? B: /내 생각엔/ it’s really good. I tried it last week and the food was amazing.","A: /원해?/ try this new restaurant in town? B: /그닥/. I’ve heard mixed reviews about it","A: /나는 ~ 인거 같지 않아/ this dress suits me. I need to try on something else."]],[1,27,"시작블록17. I’ve got 블록","I’ve got, I don’t have, I haven’t got, Do you have, Have you got",["A: /있어요/a lot of work to do today.","A: /나 있어/ tickets to the concert next week.","A: /없어요/ any cash on me, do you take cards?"]],[1,28,"시작블록18. I have to 블록","I have to, need, must, have got to, got to, Do you have to, Have you got to, I don’t have to, I had to, I need to",["A: /너 해야돼/ finish your homework before you can go out with your friends.","A: /나 해야돼/ go to the dentist today for a check-up.","A: /~할 필요없어/come to the party if you don't want to."]],[1,29,"시작블록19. I know 블록","I know, Do you know, I don’t know",["A: /모르겠네 / what time the movie starts.","A: /어떻게 하는지 알아요?/ to speak English fluently? (how)","A: /~인지 모르겠네/ I can make it to the meeting tomorrow (if)"]],[1,30,"코어블록3. 기본 동사 get","",["A: /나 해야돼/ 장을 좀 보는 것을/ on my way home. (groceries)","A: /그녀는 할 수 있었는데/좋은 성적을 얻는 것을/ on her exam. (grade)","A: /나 할거야/ 커피 사는 것을/ before our meeting. (coffee)"]],[1,31,"디테일블록3. 빈도(Frequency)","",["A: /항상 공부 하니?/ at the library? B: Yes, /나는 보통 거기 가/to study because it’s quiet and I can focus.","A: /저를 도와주실 수 있는지 궁금해서요./ with my math homework. B: Of course, /나는 가끔 과외해줘/other students in math, so I’m happy to help you.","A: /~하기로 했는데/ submit my essay yesterday, but I forgot. B: /넌 해야해/ 항상/ 알람설정을/ for important deadlines, so you don’t forget."]],[1,32,"시작블록20. 지각동사","",["A: / 봤어요? / John leave the building? B: Yes, I saw him leave just now.","A: / 들었어요? / the baby cry? B: Yes, I heard her cry in the other room.","A: What were they doing? B: /하는 걸 봤어요 / playing basketball in the park."]],[1,33,"시작블록21. 감각동사","",["A: How does the new chair feel? B: / / really comfortable.","A: How does this s /* ---------- Gemini (무료 등급) : 모델 자동 선택 + 한도 표시 ---------- */
function pacificDay(){ return new Intl.DateTimeFormat("en-CA", { timeZone:"America/Los_Angeles" }).format(new Date()); }
function resetTimeLocal(){
  // 다음 태평양 시간 자정을 현지 시각으로
  const now = new Date();
  for (let m = 1; m <= 26 * 60; m++) {
    const t = new Date(now.getTime() + m * 60000);
    const hm = new Intl.DateTimeFormat("en-GB", { timeZone:"America/Los_Angeles", hour:"2-digit", minute:"2-digit", hourCycle:"h23" }).format(t);
    if (hm === "00:00") return t.toLocaleTimeString("ko-KR", { hour:"numeric", minute:"2-digit" });
  }
  return "태평양 시간 자정";
}
function usage(){ const u = store.get("gm_usage", {}); return u.day === pacificDay() ? u : { day: pacificDay(), n: 0, byModel: {} }; }
function bumpUsage(model){ const u = usage(); u.n++; u.byModel[model] = (u.byModel[model] || 0) + 1; store.set("gm_usage", u); renderMeter(); }
function renderMeter(){
  const u = usage(); const cur = currentModel();
  $("#meter").innerHTML = `<span>오늘 AI 요청 <b>${u.n}</b>회</span><span>모델 ${esc(cur ? cur.replace("models/","") : "확인 전")}</span><span>한도 초기화 ${esc(resetTimeLocal())}</span>`;
}
let models = store.get("gm_models", null);      // [flash 계열 우선순위 목록]
function exhausted(){ const e = store.get("gm_exhausted", {}); return e.day === pacificDay() ? e.list : []; }
function markExhausted(m){ const l = exhausted(); if (!l.includes(m)) l.push(m); store.set("gm_exhausted", { day: pacificDay(), list: l }); }
function currentModel(){ if (!models) return null; return models.find(m => !exhausted().includes(m)) || null; }
async function ensureModels(key){
  if (models && models.length) return;
  const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers: { "x-goog-api-key": key } });
  if (!r.ok) throw await apiError(r);
  const j = await r.json();
  const ok = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map(m => m.name).filter(n => /flash/i.test(n) && !/(live|tts|image|audio|transcribe|translate|embedding|thinking-exp|exp-)/i.test(n));
  const ver = n => { const m = n.match(/gemini-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
  const score = n => ver(n) * 10 + (/lite/i.test(n) ? 0 : 5) - (/preview/i.test(n) ? 2 : 0) - (/-\d{3,}$|-\d{2}-\d{4}$/.test(n) ? 1 : 0);
  const flash = ok.filter(n => !/lite/i.test(n)).sort((a,b) => score(b) - score(a)).slice(0, 2);
  const lite = ok.filter(n => /lite/i.test(n)).sort((a,b) => score(b) - score(a)).slice(0, 2);
  models = flash.concat(lite);
  if (!models.length) throw { kind:"other", msg:"이 키로 쓸 수 있는 Gemini Flash 모델을 찾지 못했어요." };
  store.set("gm_models", models);
}
async function apiError(r){
  let j = null; try { j = await r.json(); } catch(e) {}
  const e = (j && j.error) || {};
  if (r.status === 429) {
    const det = e.details || [];
    const qf = det.find(d => /QuotaFailure/.test(d["@type"] || "")); const ri = det.find(d => /RetryInfo/.test(d["@type"] || ""));
    const ids = ((qf && qf.violations) || []).map(v => (v.quotaId || "") + " " + (v.quotaMetric || "")).join(" ");
    const perDay = /PerDay/i.test(ids) || /per day|daily/i.test(e.message || "");
    const secs = ri && ri.retryDelay ? Math.ceil(parseFloat(ri.retryDelay)) : 60;
    return { kind: perDay ? "day" : "minute", secs, msg: e.message };
  }
  if (r.status === 400 && /API key/i.test(e.message || "")) return { kind:"key", msg: e.message };
  if (r.status === 403) return { kind:"key", msg: e.message };
  return { kind:"other", msg: e.message || ("HTTP " + r.status) };
}
let cooldownTimer = null;
function showBanner(html, cls){ const b = $("#banner"); b.className = "banner " + (cls || "warn"); b.innerHTML = html; b.hidden = false; }
function hideBanner(){ $("#banner").hidden = true; }
function startCooldown(secs){
  clearInterval(cooldownTimer); let s = secs;
  const tick = () => {
    if (s <= 0) { clearInterval(cooldownTimer); hideBanner(); $("#mic").disabled = false; return; }
    showBanner(`<b>분당 한도 초과</b> · 너무 빨리 연속으로 불렀어요. <b>${s}초</b> 뒤 다시 누를 수 있어요.`); s--;
  };
  $("#mic").disabled = true; tick(); cooldownTimer = setInterval(tick, 1000);
}
async function gemini(prompt){
  const key = store.get("gm_key", "");
  if (!key) throw { kind:"nokey" };
  await ensureModels(key);
  for (;;) {
    const model = currentModel();
    if (!model) throw { kind:"allday" };
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model}:generateContent`, {
      method:"POST", headers:{ "Content-Type":"application/json", "x-goog-api-key": key },
      body: JSON.stringify({ contents:[{ role:"user", parts:[{ text: prompt }] }], generationConfig:{ responseMimeType:"application/json", temperature:0.8 } })
    });
    bumpUsage(model);
    if (r.ok) {
      const j = await r.json();
      const text = (((j.candidates || [])[0] || {}).content || {}).parts?.map(p => p.text || "").join("") || "";
      try { return JSON.parse(text); } catch(e) { const m = text.match(/\{[\s\S]*\}/); if (m) return JSON.parse(m[0]); throw { kind:"other", msg:"AI 답을 읽지 못했어요. 다시 눌러 주세요." }; }
    }
    const err = await apiError(r);
    if (err.kind === "day") {
      markExhausted(model);
      const next = currentModel();
      if (next) { showBanner(`<b>오늘 한도 소진</b> · ${esc(model.replace("models/",""))} 모델을 다 썼어요. <b>${esc(next.replace("models/",""))}</b>로 바꿔서 계속할게요. (${esc(resetTimeLocal())}에 초기화)`); renderMeter(); continue; }
      throw { kind:"allday" };
    }
    throw err;
  }
}
function handleErr(e){
  if (!e || !e.kind) { setStatus("문제가 생겼어요. 다시 눌러 주세요."); return; }
  if (e.kind === "minute") { startCooldown(e.secs || 60); setStatus(""); return; }
  if (e.kind === "allday") { showBanner(`<b>오늘 무료 한도를 모두 썼어요</b> · 쓸 수 있는 모델이 남지 않았어요. <b>${esc(resetTimeLocal())}</b>에 초기화돼요.`, "bad"); setStatus(""); return; }
  if (e.kind === "nokey") { $("#settings").hidden = false; setStatus("설정에서 Gemini 키를 먼저 저장해 주세요."); return; }
  if (e.kind === "key") { $("#settings").hidden = false; showBanner("<b>Gemini 키 오류</b> · 키가 맞는지 설정에서 확인해 주세요.", "bad"); setStatus(""); return; }
  setStatus(e.msg || "문제가 생겼어요. 다시 눌러 주세요.");
}

/* ---------- Azure: 말하기(TTS) · 듣기+발음채점 ---------- */
function azCfg(){
  const key = store.get("az_key", ""), region = store.get("az_region", "eastus");
  if (!key || !window.SpeechSDK) return null;
  return SpeechSDK.SpeechConfig.fromSubscription(key, region);
}
let player = null;
function stopSpeaking(){ try { if (player) { player.pause(); } } catch(e) {} try { speechSynthesis.cancel(); } catch(e) {} }
function ssmlOf(parts){
  const rate = Math.round((store.get("tts_rate", 1) - 1) * 100);
  const v = { ko:"ko-KR-SunHiNeural", en:"en-US-JennyNeural" };
  return `<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="ko-KR">` +
    parts.filter(p => p.text).map(p => `<voice name="${v[p.lang]}"><prosody rate="${rate}%">${esc(p.text)}</prosody></voice>`).join("") + `</speak>`;
}
function speak(parts){
  return new Promise(resolve => {
    stopSpeaking();
    const cfg = azCfg();
    if (!cfg) { fallbackSpeak(parts).then(resolve); return; }
    cfg.speechSynthesisOutputFormat = SpeechSDK.SpeechSynthesisOutputFormat.Audio24Khz48KBitRateMonoMp3;
    const synth = new SpeechSDK.SpeechSynthesizer(cfg, null);
    synth.speakSsmlAsync(ssmlOf(parts), res => {
      synth.close();
      if (res.reason === SpeechSDK.ResultReason.SynthesizingAudioCompleted) {
        const url = URL.createObjectURL(new Blob([res.audioData], { type:"audio/mpeg" }));
        player = new Audio(url); player.onended = () => resolve(); player.onerror = () => resolve();
        player.play().catch(() => resolve());
      } else fallbackSpeak(parts).then(resolve);
    }, () => { synth.close(); fallbackSpeak(parts).then(resolve); });
  });
}
function fallbackSpeak(parts){
  return new Promise(resolve => {
    try {
      const list = parts.filter(p => p.text); if (!list.length) return resolve();
      list.forEach((p, i) => { const u = new SpeechSynthesisUtterance(p.text); u.lang = p.lang === "ko" ? "ko-KR" : "en-US"; u.rate = store.get("tts_rate", 1); if (i === list.length - 1) { u.onend = resolve; u.onerror = resolve; } speechSynthesis.speak(u); });
    } catch(e) { resolve(); }
  });
}
let recognizer = null;
function listen(){
  return new Promise((resolve, reject) => {
    const cfg = azCfg();
    if (!cfg) { reject({ kind:"az" }); return; }
    cfg.speechRecognitionLanguage = "en-US";
    cfg.setProperty(SpeechSDK.PropertyId.SpeechServiceConnection_EndSilenceTimeoutMs, "1300");
    const pa = new SpeechSDK.PronunciationAssessmentConfig("", SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark, SpeechSDK.PronunciationAssessmentGranularity.Phoneme, false);
    pa.phonemeAlphabet = "IPA"; pa.nbestPhonemeCount = 3;
    try { pa.enableProsodyAssessment = true; } catch(e) {}
    recognizer = new SpeechSDK.SpeechRecognizer(cfg, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
    pa.applyTo(recognizer);
    recognizer.recognizeOnceAsync(res => {
      const r = recognizer; recognizer = null; try { r.close(); } catch(e) {}
      if (res.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
        let j = null; try { j = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult)); } catch(e) {}
        resolve({ text: res.text, json: j });
      } else if (res.reason === SpeechSDK.ResultReason.NoMatch) reject({ kind:"nomatch" });
      else { const d = SpeechSDK.CancellationDetails.fromResult(res); reject({ kind:"azerr", msg: d.errorDetails }); }
    }, err => { recognizer = null; reject({ kind:"mic", msg: String(err) }); });
  });
}
function pronSummary(json){
  const nb = json && json.NBest && json.NBest[0]; if (!nb) return { text:"(발음 데이터 없음)", scores:null };
  const pa = nb.PronunciationAssessment || {};
  const low = []; let breaks = [];
  (nb.Words || []).forEach(w => {
    const a = w.PronunciationAssessment || {};
    const fb = a.Feedback && a.Feedback.Prosody;
    if (fb && fb.Break && (fb.Break.ErrorTypes || []).some(t => t !== "None")) breaks.push(w.Word);
    const badPh = (w.Phonemes || []).filter(p => (p.PronunciationAssessment || {}).AccuracyScore < 60).map(p => {
      const nbp = (p.PronunciationAssessment || {}).NBestPhonemes; const heard = nbp && nbp[0] && nbp[0].Phoneme !== p.Phoneme ? `→${nbp[0].Phoneme}` : "";
      return `/${p.Phoneme}/${heard}`; });
    if ((a.AccuracyScore ?? 100) < 75 || badPh.length) low.push(`${w.Word}(${Math.round(a.AccuracyScore ?? 0)}${badPh.length ? " " + badPh.join(" ") : ""})`);
  });
  const sc = { pron: pa.PronScore, acc: pa.AccuracyScore, flu: pa.FluencyScore, pros: pa.ProsodyScore };
  const text = `종합 ${Math.round(sc.pron ?? 0)} · 정확도 ${Math.round(sc.acc ?? 0)} · 유창성 ${Math.round(sc.flu ?? 0)} · 운율·억양 ${sc.pros != null ? Math.round(sc.pros) : "-"}\n낮은 단어/음소: ${low.join(", ") || "없음"}\n끊긴 곳(다음 단어 앞에서 끊김): ${breaks.join(", ") || "없음"}`;
  return { text, scores: sc };
}

Azure 발음 채점:
${ps.text}
${notes.length ? "코치에게 예전에 지적받은 단어: " + notes.map(([k,v]) => `${k}: "${v[2]}"`).join(" / ") : ""}

규칙:
- verdict: 의미가 맞고 목표 블록을 썼으면 "pass", 고칠 점이 있으면 "close", 의미가 틀리거나 블록을 안 썼으면 "retry".
- corrected: 최소 수정한 자연스러운 문장. 강세 내용어는 대문자, 연음 경계는 ‿.
- issues: 문장·표현 고칠 점 최대 2개(한국어 한 문장씩). 없으면 [].
- sound: Azure 채점에서 실제로 낮게 나온 단어·음소·끊김·억양을 근거로 한 발음 팁 1~2개(한국어, 구체적으로). 점수가 모두 높으면 칭찬 1개.
- say: 소리 내어 읽어 줄 코치 멘트. 한국어 2문장 이내, "태원님~"으로 시작.
- weak_tag: 고칠 점이 있으면 8자 안팎 태그, 없으면 "".
- next: ${S.mode === "drill" ? "다음 문제. " + questionRule().replace(/\n/g, " ") : "null"}
JSON 한 개만: {"verdict":"","corrected":"","issues":[],"sound":[],"say":"","weak_tag":"","next":{"stage":1,"part":34,"ko":"","target":"","hint":"","model":""}}`);
  renderFb(f, ps.scores, heard.text);
  record(heard.text, f, ps.scores);
  setStatus("");
  await speak([{ lang:"ko", text: f.say }, { lang:"en", text: plain(f.corrected) }]);
  if (f.next && f.next.ko) await showQuestion(f.next); else { setMic("idle"); }
}
function record(answer, f, sc){
  const h = store.get("vs_hist", []); h.unshift({ t: Date.now(), mode: S.mode, answer, verdict: f.verdict, corrected: plain(f.corrected), pron: sc && Math.round(sc.pron || 0) });
  store.set("vs_hist", h.slice(0, 300));
  if (f.weak_tag && f.verdict !== "pass") { const w = store.get("vs_weak", []); w.unshift({ tag: f.weak_tag, t: Date.now() }); store.set("vs_weak", w.slice(0, 40)); }
}

/* ---------- 대화 ---------- */
function chatRules(){
  return `너는 영어 회화 파트너이자 소리블록 코치야. 학습자는 태원(한국인, 데이터센터 개발·투자 일을 함). 주제: ${S.topic}.
태원이 아래 PART의 블록을 자연스럽게 쓰게 만드는 대화를 해.
${scopeParts().map(brief).join("\n")}
${COACH}
태원의 최근 약점: ${weakTags()}`;
}
async function chatStart(){
  turns = []; setMic("wait"); setStatus("대화 준비 중…");
  const r = await gemini(`${chatRules()}
대화를 시작해. 쉬운 구어체 영어 1~2문장, 질문으로 끝내기.
JSON 한 개만: {"reply":"영어","reply_ko":"한국어 뜻","target":"유도하는 블록"}`);
  await aiSays(r);
}
async function aiSays(r){
  turns.push({ role:"AI", text: r.reply });
  const m = addMsg("ai", `<span>${esc(r.reply)}</span><span class="sub">${esc(r.reply_ko || "")}${r.target ? " · 써 볼 블록: " + esc(r.target) : ""}</span><button class="again">▶ 다시 듣기</button>`);
  m.querySelector("button").onclick = () => speak([{ lang:"en", text: r.reply }]);
  setMic("wait"); await speak([{ lang:"en", text: r.reply }]); setMic("idle"); setStatus("");
}
async function chatAnswer(heard){
  const ps = pronSummary(heard.json);
  addMsg("me", `<span>${esc(heard.text)}</span>`);
  turns.push({ role:"태원", text: heard.text });
  setMic("wait"); setStatus("답 쓰는 중…");
  const r = await gemini(`${chatRules()}
지금까지 대화:
${turns.slice(-12).map(t => t.role + ": " + t.text).join("\n")}
태원의 마지막 말에 대한 Azure 발음 채점:
${ps.text}

규칙: 대화를 이어가되, 태원의 마지막 말을 짧게 교정해 줘.
JSON 한 개만: {"feedback":{"verdict":"pass|close|retry","corrected":"강세 대문자·연음‿ 교정문","issues":["한국어 한 문장"],"sound":["Azure 결과 근거 발음 팁 1개"],"say":"한국어 코치 멘트 1문장","weak_tag":""},"reply":"영어 1~2문장, 질문으로 끝","reply_ko":"한국어 뜻","target":"유도하는 블록"}`);
  const f = r.feedback || {};
  renderFb(f, ps.scores, heard.text);
  record(heard.text, f, ps.scores);
  await speak([{ lang:"ko", text: f.say }]);
  await aiSays(r);
}

/* ---------- 마이크 버튼 ---------- */
let started = false;
$("#mic").onclick = async () => {
  if (recognizer) { try { recognizer.close(); } catch(e) {} recognizer = null; setMic("idle"); return; }
  if (busy) return;
  busy = true; hideBanner(); stopSpeaking();
  try {
    if (!started) {
      if (!store.get("gm_key", "") || !store.get("az_key", "")) { $("#settings").hidden = false; setStatus("설정에서 Gemini 키와 Azure 키를 먼저 저장해 주세요."); busy = false; return; }
      started = true;
      await (S.mode === "drill" ? drillStart() : chatStart());
    } else {
      setMic("rec"); setStatus("말씀하세요.");
      const heard = await listen();
      await (S.mode === "drill" ? drillAnswer(heard) : chatAnswer(heard));
    }
  } catch(e) {
    if (e && e.kind === "nomatch") setStatus("소리를 알아듣지 못했어요. 폰 가까이에서 다시 말해 주세요.");
    else if (e && e.kind === "mic") setStatus("마이크를 쓸 수 없어요. 브라우저의 마이크 권한을 허용해 주세요.");
    else if (e && (e.kind === "az" || e.kind === "azerr")) setStatus("Azure에 연결하지 못했어요. 설정의 Azure 키와 지역을 확인해 주세요.");
    else handleErr(e);
    if (!started || !(item || turns.length)) started = false;
    setMic(started ? "idle" : "start");
  }
  busy = false;
};

/* ---------- 선택 변경 ---------- */
function restart(){ started = false; item = null; turns = []; setMic("start"); setStatus("설정이 바뀌었어요. 시작을 누르면 새로 시작해요."); }
$("#stage").onchange = e => { S.stage = +e.target.value; S.part = partsOf(S.stage)[0][1]; renderParts(); saveS(); restart(); };
$("#partSel").onchange = e => { S.part = +e.target.value; renderParts(); saveS(); restart(); };
document.querySelectorAll("[data-scope]").forEach(b => b.onclick = () => { S.scope = b.dataset.scope; renderParts(); saveS(); restart(); });
document.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { S.topic = b.dataset.topic; renderParts(); saveS(); if (S.mode === "chat") restart(); });
function setMode(m){
  S.mode = m; saveS();
  $("#tabDrill").setAttribute("aria-selected", String(m === "drill")); $("#tabChat").setAttribute("aria-selected", String(m === "chat"));
  $("#topics").hidden = m !== "chat"; restart(); setStatus("");
}
$("#tabDrill").onclick = () => setMode("drill");
$("#tabChat").onclick = () => setMode("chat");

loadSettings(); renderParts(); setMode(S.mode); renderMeter();
if (!store.get("gm_key", "")) { $("#settings").hidden = false; setStatus("처음 한 번만 Gemini 키를 저장해 주세요. Azure 키는 채점기에서 넣은 게 자동으로 들어와 있어요."); }
</script>
</body>
</html>
